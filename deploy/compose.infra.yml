name: nktc-infra

services:
  postgres:
    image: postgres:18-alpine
    container_name: nktc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nktc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nktc
    volumes:
      - nktc_pg18:/var/lib/postgresql
    ports:
      - "127.0.0.1:5436:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nktc -d nktc"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-net

  minio:
    image: minio/minio:latest
    container_name: nktc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - nktc_minio:/data
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app-net

networks:
  app-net:
    external: true
    name: app-net

volumes:
  nktc_pg18:
  nktc_minio:
