services:
  backend:
    container_name: nktc-backend
    cpus: 1.5
    mem_limit: 1536m

  frontend:
    container_name: nktc-frontend
    cpus: 1.0
    mem_limit: 768m
    build:
      args:
        NEXT_PUBLIC_APP_URL: https://nktc.thapabp.com
        NEXT_PUBLIC_API_BASE_PATH: /api/backend
        NEXT_PUBLIC_EDUCATION_YEARS: "2569"
