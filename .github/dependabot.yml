version: 2
updates:
  # Root workspace manifest (bun.lock, workspaces: frontend + backend-elysia)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Frontend manifest (shares the root bun.lock)
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Backend manifest (own bun.lock)
  - package-ecosystem: bun
    directory: /backend-elysia
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Keep GitHub Actions (deploy.yml) up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
