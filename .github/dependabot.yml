version: 2
updates:
  # Root workspace manifest (bun.lock, workspaces: frontend + backend-elysia)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Frontend manifest (shares the root bun.lock)
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major TypeScript bumps need a deliberate upgrade pass
      - dependency-name: typescript
        versions: [">=6"]
      # Major @vitest/ui bumps need the matching vitest major
      - dependency-name: "@vitest/ui"
        versions: [">=5"]

  # Backend manifest (own bun.lock)
  - package-ecosystem: bun
    directory: /backend-elysia
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # dotenv 17+ is a major runtime change — upgrade deliberately
      - dependency-name: dotenv
        versions: [">=17"]

  # Keep GitHub Actions (deploy.yml) up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
